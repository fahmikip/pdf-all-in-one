name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

jobs:
  test:
    name: Run tests (Python ${{ matrix.python-version }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Format check
        run: ruff format --check .

      - name: Run tests with coverage
        run: python -m pytest --cov --cov-report=term-missing --cov-report=xml:coverage.xml

      - name: Refresh coverage badge
        if: github.ref == 'refs/heads/main' && matrix.python-version == '3.12'
        run: python scripts/make_coverage_badge.py

      - name: Commit coverage badge
        if: github.ref == 'refs/heads/main' && matrix.python-version == '3.12'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/badges/coverage.svg
          git diff --cached --quiet && echo "Coverage badge unchanged." || git commit -m "chore(docs): update coverage badge"
          git push
