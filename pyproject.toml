[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pdf-master"
version = "1.5.0"
description = "Perangkat PDF all-in-one offline untuk Windows"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Fahmikip", email = "fahmikip@users.noreply.github.com" }]
keywords = ["pdf", "pdf-tools", "offline", "pyside6", "windows"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3.12",
    "Topic :: Utilities",
]
dependencies = [
    "PySide6>=6.7,<7",
    "PyMuPDF>=1.24,<2",
    "pikepdf>=9,<10",
    "Pillow>=10.4,<12",
    "python-docx>=1.1,<2",
    "openpyxl>=3.1,<4",
]

[project.urls]
Homepage = "https://github.com/fahmikip/pdf-all-in-one"
Source = "https://github.com/fahmikip/pdf-all-in-one"
Releases = "https://github.com/fahmikip/pdf-all-in-one/releases"
Issues = "https://github.com/fahmikip/pdf-all-in-one/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "pytest-cov>=6,<8",
    "pyinstaller>=6.10,<7",
    "ruff>=0.16,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 119
src = ["app", "core", "ui", "tests", "installer", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = [
    "BLE001",
    "DTZ005",
    "DTZ011",
    "E501",
    "E701",
    "E702",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105"]

[tool.coverage.run]
branch = true
source = ["core", "app"]

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]